name: docs-svg

# Builds the diagrams of the Emacs config docs (.config/emacs-modular/docs/Makefile).
# On pull requests it only checks that every dot block renders; on main it
# publishes the .svg files to the docs-assets branch, which holds nothing else.

on:
  pull_request:
    paths: ['.config/emacs-modular/docs/**']
  push:
    branches: [main]
    paths: ['.config/emacs-modular/docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: make -C .config/emacs-modular/docs docs
      - name: Publish to docs-assets
        if: github.event_name != 'pull_request'
        run: |
          out="$RUNNER_TEMP/docs-assets"
          mkdir -p "$out"
          cd .config/emacs-modular/docs
          find . -name '*.svg' -not -path './.build/*' -exec cp --parents {} "$out" \;
          cd "$out"
          printf 'Generated by .github/workflows/docs-svg.yml from %s. Do not edit.\n' "$GITHUB_SHA" > README.txt
          git init -q -b docs-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: SVGs built from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" docs-assets
