# Enable transparency for all the windows in i3
inactive-opacity = 0.80;
active-opacity = 0.95;
frame-opacity = 0.70;

# Let inactive opacity set by -i override the '_NET_WM_WINDOW_OPACITY' values of windows.
inactive-opacity-override = true;

# if for some reason you want all windows transparent
# active-opacity = 1.0

# inactive-dim = 0.05

# fixed inactive dim value
# inactive-dim-fixed = 1.0

# focus-exclude = [ "class_g = 'dwm'" ];

# opacity-rule = [
    # "50:class_g = 'qutebrowser' && '!focused'" 
# ];


# ROUNDED CORNERS
corner-radius = 15

# uncommented for square notification box
# rounded-corners-exclude = [
  # "class_g = 'Dunst'"
# ];


# BLURRING
# methods: none, gaussian, box, kernel (define custom kernel), dual_kawase
blur:
{
  method = "dual_kawase";
  size = 9;
  strength = 5;
# default deviation is 0.84
# deviation = false;
};

# Adding blur into the transparency to enhance readability
# blur: {
#   method = "kawase";
#   strength = 9;
#   background = false;
#   background-frame = false;
#   background-fixed = false;
# }

# semi-transparent
blur-background = true

# blur-background-frame = true
# Use fixed blur strength rather than adjusting according to window opacity.
blur-background-fixed = true

# set custom blur kernel (method to kernel), preset examples:
# blur-kern = "3x3box";
# blur-kern = "5x5gaussian";


# SHADOWS
# shadow = true; # this allows me to toggle on shadows solely for qutebrowser, to create a muted/blurred look behind tabs when combined with qutebrowser's transparent tabs setting.
shadow-radius = 1; # blur radius
shadow-opacity = 0.1

shadow-offset-x = 0;
shadow-offset-y = 0;

# shadow-color = "#000000"
shadow-color = "#393943" # this could be set with a pywal template instead
# shadow-exclude = [];


# FADING
fading = true;

fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4


# OTHER SETTINGS
# dbus = true
# daemon = false

# backends: `xrender`, `glx`, `egl` or `xr_glx_hybrid`
backend = "egl"; # faster than xrender, egl is still experimental but it's pretty much ok

dithered-present = false;
vsync = true;

# mark-wmwin-focused = true;

# mark-ovredir-focused = true;

detect-rounded-corners = false
detect-client-opacity = true;
use-ewmh-active-win = true
detect-transient = true;
# glx-no-stencil = true
use-damage = true;
log-level = "warn";

wintypes:
{
  tooltip = { 
  	fade = true; 
	shadow = true;
	opacity = 0.5;
	focus = true;
	full-shadow = false;
	};
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.7; }
  dropdown_menu = { opacity = 0.7; }
};

# picom -b to daemonize
