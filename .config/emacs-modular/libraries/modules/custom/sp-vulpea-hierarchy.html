<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vulpea hierarchy</title>
<style>
:root{--bg:#fbfbfa;--fg:#222;--muted:#777;--node:#f2f2f0;--edge:#9a9a9a;--root:#d8e6f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1f21;--fg:#e6e6e6;--muted:#999;--node:#2a2d31;--edge:#666;--root:#2f4a66}}
:root[data-theme="dark"]{--bg:#1d1f21;--fg:#e6e6e6;--muted:#999;--node:#2a2d31;--edge:#666;--root:#2f4a66}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{height:22px;padding:8px 12px;color:var(--muted);border-bottom:1px solid var(--edge);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
svg{position:absolute;top:38px;left:0;width:100%;height:calc(100% - 38px);cursor:grab;touch-action:none}
.node rect{fill:var(--node);stroke:var(--edge)}
.node.root rect{fill:var(--root)}
.node text{fill:var(--fg);pointer-events:none;font:14px system-ui,sans-serif}
.node .tags,.node .more{fill:var(--muted)}
.edge{fill:none;stroke:var(--edge);stroke-width:1.2}
</style>
</head>
<body>
<header id="head"></header>
<svg id="v" xmlns="http://www.w3.org/2000/svg"><g id="vp"></g></svg>
<script>
const D = __DATA__;
const NS = 'http://www.w3.org/2000/svg';
const W = 240, PAD = 10, LINE = 18, VPAD = 6, GAP = 10, COL = 300;
const TEXT_W = W - 2 * PAD;
const byId = new Map(D.nodes.map(n => [n.id, n]));
const kids = new Map();
for (const [p, c] of D.edges) { if (!kids.has(p)) kids.set(p, []); kids.get(p).push(c); }
const collapsed = new Set();
const infoCache = new Map();
const view = { x: 40, y: 20, k: 1 };
const vp = document.getElementById('vp');
const svg = document.getElementById('v');
const ctx = document.createElement('canvas').getContext('2d');
ctx.font = '14px system-ui, sans-serif';
let dragStart = null, dragged = false;

document.getElementById('head').textContent =
  (byId.get(D.root) || {}).title + '  ·  depth ' + D.depth +
  '  ·  click a box to fold  ·  scroll to zoom, drag to pan  ·  +N = hidden children (rerun with a bigger depth)';

function measure(s) { return ctx.measureText(s).width; }

function tokensOf(n) {
  const t = n.title.split(/\s+/).filter(Boolean).map(w => ({ text: w, cls: '' }));
  if (n.tags && n.tags.length) t.push({ text: ':' + n.tags.join(':') + ':', cls: 'tags' });
  if (n.more) t.push({ text: '+' + n.more, cls: 'more' });
  return t;
}

function breakToken(tok) {
  const out = [];
  let rest = tok.text;
  while (measure(rest) > TEXT_W && rest.length > 1) {
    let i = rest.length;
    while (i > 1 && measure(rest.slice(0, i)) > TEXT_W) i--;
    out.push({ text: rest.slice(0, i), cls: tok.cls });
    rest = rest.slice(i);
  }
  out.push({ text: rest, cls: tok.cls });
  return out;
}

function wrap(tokens) {
  const lines = [], space = measure(' ');
  let line = [], width = 0;
  for (const tok0 of tokens) {
    for (const tok of breakToken(tok0)) {
      const w = measure(tok.text);
      if (line.length && width + space + w > TEXT_W) { lines.push(line); line = []; width = 0; }
      width += (line.length ? space : 0) + w;
      line.push(tok);
    }
  }
  if (line.length) lines.push(line);
  return lines;
}

function info(id) {
  if (!infoCache.has(id)) {
    const n = byId.get(id) || { id, title: id, path: null, more: 0, tags: [] };
    const lines = wrap(tokensOf(n));
    infoCache.set(id, { n, lines, h: Math.max(1, lines.length) * LINE + 2 * VPAD });
  }
  return infoCache.get(id);
}

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}

function childrenOf(id) { return collapsed.has(id) ? [] : (kids.get(id) || []); }

function layout(id, depth, path, cursor) {
  const node = { id, depth, kids: [], y: 0, h: info(id).h };
  if (!path.includes(id)) {
    for (const c of childrenOf(id)) node.kids.push(layout(c, depth + 1, [...path, id], cursor));
  }
  if (node.kids.length) {
    const first = node.kids[0], last = node.kids[node.kids.length - 1];
    node.y = (first.y + first.h / 2 + last.y + last.h / 2) / 2 - node.h / 2;
    cursor.y = Math.max(cursor.y, node.y + node.h + GAP);
  } else {
    node.y = cursor.y;
    cursor.y += node.h + GAP;
  }
  return node;
}

function topOf(node) { return Math.min(node.y, ...node.kids.map(topOf)); }

function draw(node, parent, shift) {
  const { n, lines } = info(node.id);
  const x = node.depth * COL, y = node.y + shift;
  if (parent) {
    const px = parent.x + W, py = parent.y + parent.h / 2, cy = y + node.h / 2;
    el('path', { class: 'edge', d: `M${px},${py} C${px + 40},${py} ${x - 40},${cy} ${x},${cy}` }, vp);
  }
  const g = el('g', { class: 'node' + (node.id === D.root ? ' root' : ''), transform: `translate(${x},${y})` }, vp);
  el('rect', { width: W, height: node.h, rx: 6 }, g);
  lines.forEach((line, i) => {
    const t = el('text', { x: PAD, y: VPAD + LINE * i + 13 }, g);
    line.forEach((tok, j) => {
      const s = el('tspan', tok.cls ? { class: tok.cls } : {}, t);
      s.textContent = (j ? ' ' : '') + tok.text;
    });
  });
  el('title', {}, g).textContent = n.path || n.title;
  if ((kids.get(node.id) || []).length) {
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => {
      if (dragged) return;
      if (collapsed.has(node.id)) collapsed.delete(node.id); else collapsed.add(node.id);
      render();
    });
  }
  for (const k of node.kids) draw(k, { x, y, h: node.h }, shift);
}

function render() {
  vp.replaceChildren();
  const root = layout(D.root, 0, [], { y: 0 });
  draw(root, null, -topOf(root));
  apply();
}

function apply() {
  vp.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
}

svg.addEventListener('wheel', e => {
  e.preventDefault();
  view.k = Math.min(4, Math.max(0.2, view.k * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  apply();
}, { passive: false });
svg.addEventListener('pointerdown', e => {
  dragStart = { x: e.clientX - view.x, y: e.clientY - view.y, cx: e.clientX, cy: e.clientY };
  dragged = false;
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e => {
  if (!dragStart) return;
  if (Math.hypot(e.clientX - dragStart.cx, e.clientY - dragStart.cy) > 4) dragged = true;
  view.x = e.clientX - dragStart.x;
  view.y = e.clientY - dragStart.y;
  apply();
});
svg.addEventListener('pointerup', () => { dragStart = null; });
render();
</script>
</body>
</html>
